name: Build and release APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Test
        run: flutter test

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "KEYSTORE_BASE64 secret is not set" >&2
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/release.jks

      - name: Check keystore secrets
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Keystore size: $(stat -c %s android/app/release.jks) bytes"
          echo "Keystore sha256 starts: $(sha256sum android/app/release.jks | cut -c1-16)"
          echo "Password lengths: store ${#KEYSTORE_PASSWORD}, key ${#KEY_PASSWORD}, alias ${#KEY_ALIAS}"
          if ! keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" > /tmp/ks.txt 2>&1; then
            echo "::error::KEYSTORE_PASSWORD does not open the keystore, or KEYSTORE_BASE64 is damaged"
            grep -v JAVA_TOOL /tmp/ks.txt | tail -3
            exit 1
          fi
          if ! keytool -list -keystore android/app/release.jks -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::KEY_ALIAS is not in the keystore"
            exit 1
          fi
          if [ "$KEY_PASSWORD" != "$KEYSTORE_PASSWORD" ]; then
            echo "::error::KEY_PASSWORD must equal KEYSTORE_PASSWORD for this keystore"
            exit 1
          fi
          echo "Keystore secrets OK"

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter build apk --release \
            --build-number=${{ github.run_number }} \
            --build-name=0.1.${{ github.run_number }}
          cp build/app/outputs/flutter-apk/app-release.apk \
            project-todo-0.1.${{ github.run_number }}.apk

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" \
            "project-todo-0.1.${{ github.run_number }}.apk" \
            --title "Build ${{ github.run_number }} (0.1.${{ github.run_number }})" \
            --notes "Commit ${{ github.sha }}" \
            --target "${{ github.sha }}"

      - name: Remove keystore
        if: always()
        run: rm -f android/app/release.jks
